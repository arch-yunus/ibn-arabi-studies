<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="40%" stop-color="#0a1226" />
      <stop offset="80%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#080c1a" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#fda085" />
      <stop offset="100%" stop-color="#f6d365" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="mysticGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0c3fc" />
      <stop offset="100%" stop-color="#8ec5fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#233554" stroke-width="2"/>

  <!-- Concentric Mystic Celestial Circles (Cosmic Astrolabe Pattern) -->
  <g opacity="0.18" stroke="#f6d365" stroke-width="1.2" fill="none" transform="translate(600, 210)">
    <circle r="180" stroke-dasharray="6,6"/>
    <circle r="150" />
    <circle r="120" stroke-dasharray="4,8"/>
    <circle r="90" />
    <circle r="60" stroke-dasharray="2,4"/>
    <circle r="30" />
    <!-- 8-Point Star Geometry -->
    <polygon points="0,-150 106,-106 150,0 106,106 0,150 -106,106 -150,0 -106,-106" stroke="#4facfe" stroke-width="1"/>
    <polygon points="0,-150 150,0 0,150 -150,0" stroke="#f6d365" stroke-width="1.5"/>
    <polygon points="106,-106 106,106 -106,106 -106,-106" stroke="#e0c3fc" stroke-width="1"/>
  </g>

  <!-- Subtle Side Accents -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1" fill="none">
    <circle cx="100" cy="210" r="140" stroke-dasharray="5,5"/>
    <circle cx="1100" cy="210" r="140" stroke-dasharray="5,5"/>
  </g>

  <!-- Top Arabic Calligraphy Subtitle -->
  <text x="600" y="85" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade', serif" font-size="28" fill="#e0c3fc" opacity="0.9" filter="url(#softGlow)">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ • كِتَابُ مَعْرِفَةِ الْوُجُودِ
  </text>

  <!-- Title Badge -->
  <g transform="translate(480, 115)">
    <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <text x="120" y="21" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="2">
      ✦ ÉTUDES AKBARIENNES ✦
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="210" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Segoe UI', serif" font-size="54" font-weight="800" fill="url(#goldGrad)" letter-spacing="6" filter="url(#glow)">
    IBN ARABI STUDIES
  </text>

  <!-- Subtitle -->
  <text x="600" y="255" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1" letter-spacing="3">
    Muhyiddin İbnü'l-Arabî (eş-Şeyhü'l-Ekber) Açık Kaynak Araştırma Külliyatı
  </text>

  <!-- Ornamental Divider -->
  <g transform="translate(400, 285)" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8">
    <line x1="0" y1="0" x2="160" y2="0" />
    <circle cx="200" cy="0" r="5" fill="#f6d365" />
    <polygon points="200,-9 209,0 200,9 191,0" fill="none" stroke="#f6d365" stroke-width="1"/>
    <line x1="240" y1="0" x2="400" y2="0" />
  </g>

  <!-- Bottom Core Pillars Badges -->
  <g transform="translate(180, 325)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="180" height="42" rx="8" fill="#131e3a" stroke="#2563eb" stroke-width="1.2"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#93c5fd">
      🌌 Vahdet-i Vücûd
    </text>

    <!-- Pillar 2 -->
    <rect x="220" y="0" width="180" height="42" rx="8" fill="#131e3a" stroke="#d97706" stroke-width="1.2"/>
    <text x="310" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#fcd34d">
      💎 Fusûsü'l-Hikem
    </text>

    <!-- Pillar 3 -->
    <rect x="440" y="0" width="180" height="42" rx="8" fill="#131e3a" stroke="#059669" stroke-width="1.2"/>
    <text x="530" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">
      🏛️ el-Fütûhât
    </text>

    <!-- Pillar 4 -->
    <rect x="660" y="0" width="180" height="42" rx="8" fill="#131e3a" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="750" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c4b5fd">
      ⭐️ İnsan-ı Kâmil
    </text>
  </g>
</svg>
