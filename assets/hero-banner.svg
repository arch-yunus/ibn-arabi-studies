<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0b132b" />
      <stop offset="80%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#fda085" />
      <stop offset="100%" stop-color="#f6d365" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#bgGrad1)" stroke="#3a506b" stroke-width="2"/>

  <!-- Geometric Mandala / Astrolabe -->
  <g opacity="0.22" stroke="#f6d365" stroke-width="1.2" fill="none" transform="translate(600, 200)">
    <circle r="170" stroke-dasharray="6,6"/>
    <circle r="140" />
    <circle r="110" stroke-dasharray="4,6"/>
    <circle r="80" />
    <polygon points="0,-140 99,-99 140,0 99,99 0,140 -99,99 -140,0 -99,-99" stroke="#4facfe" stroke-width="1.2"/>
    <polygon points="0,-140 140,0 0,140 -140,0" stroke="#f6d365" stroke-width="1.5"/>
  </g>

  <text x="600" y="75" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', serif" font-size="26" fill="#e0c3fc" opacity="0.9">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ • كِتَابُ مَعْرِفَةِ الْوُجُودِ
  </text>

  <g transform="translate(485, 105)">
    <rect width="230" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.85"/>
    <text x="115" y="20" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="2">
      ✦ ÉTUDES AKBARIENNES ✦
    </text>
  </g>

  <text x="600" y="195" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="52" font-weight="800" fill="url(#goldGrad1)" letter-spacing="6" filter="url(#glow1)">
    IBN ARABI STUDIES
  </text>

  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" letter-spacing="3">
    Muhyiddin İbnü'l-Arabî (eş-Şeyhü'l-Ekber) Araştırma Külliyatı
  </text>

  <g transform="translate(400, 270)" stroke="url(#goldGrad1)" stroke-width="1.5" opacity="0.8">
    <line x1="0" y1="0" x2="160" y2="0" />
    <circle cx="200" cy="0" r="5" fill="#f6d365" />
    <line x1="240" y1="0" x2="400" y2="0" />
  </g>

  <!-- Badges -->
  <g transform="translate(180, 310)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="90" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#93c5fd">🌌 Vahdet-i Vücûd</text>

    <rect x="220" y="0" width="180" height="40" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
    <text x="310" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#fcd34d">💎 Fusûsü'l-Hikem</text>

    <rect x="440" y="0" width="180" height="40" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
    <text x="530" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">🏛️ el-Fütûhât</text>

    <rect x="660" y="0" width="180" height="40" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="750" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c4b5fd">⭐️ İnsan-ı Kâmil</text>
  </g>
</svg>
